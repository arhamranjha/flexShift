# Single-server production stack: Postgres + API + dashboard + worker portal behind Caddy (automatic HTTPS).
#   cp deploy/.env.production.example deploy/.env   # then fill it in
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
name: flexshift

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flexshift
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: flexshift
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flexshift -d flexshift']
      interval: 10s
      timeout: 5s
      retries: 10
    # No published ports: only the other containers can reach the database.

  api:
    build:
      context: ..
      dockerfile: apps/backend-api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://flexshift:${POSTGRES_PASSWORD}@postgres:5432/flexshift?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (at least 32 random characters) in deploy/.env}
      # The three hostnames share one registrable domain, so SameSite=Lax session cookies work.
      CORS_ORIGINS: https://app.${DOMAIN:?set DOMAIN in deploy/.env},https://work.${DOMAIN}
      ADMIN_APP_URL: https://app.${DOMAIN}
      WORKER_APP_URL: https://work.${DOMAIN}
      TRUST_PROXY: '1'
      UPLOAD_DIR: /data/uploads
      CASCADE_DELAY_MINUTES: ${CASCADE_DELAY_MINUTES:-60}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-off}
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-FlexShift <no-reply@localhost>}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      HTTP_LOGS: 'true'
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  web-admin:
    build:
      context: ..
      dockerfile: apps/web-admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
    restart: unless-stopped
    depends_on: [api]

  worker-portal:
    build:
      context: ..
      dockerfile: apps/worker-portal/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
    restart: unless-stopped
    depends_on: [api]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api, web-admin, worker-portal]
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      APP_HOST: app.${DOMAIN}
      WORKER_HOST: work.${DOMAIN}
      API_HOST: api.${DOMAIN}
    volumes:
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
