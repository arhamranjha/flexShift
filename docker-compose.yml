version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: flexshift-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: flexshift_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # `docker compose --profile app up --build` runs the whole stack.
  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/backend-api/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/flexshift_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      NODE_ENV: production
      ENABLE_SWAGGER: 'true'
    ports: ['4000:4000']
    depends_on: [postgres]

  web-admin:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/web-admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    ports: ['3000:3000']
    depends_on: [api]

  worker-portal:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/worker-portal/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    ports: ['3001:3001']
    depends_on: [api]

volumes:
  postgres_data:
